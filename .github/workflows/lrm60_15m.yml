name: LRM-60 v2.0 · 15분 수집

on:
  schedule:
    # KST 평일 09:07~16:07, 15분 간격 (UTC 00:07~07:07)
    # 시작 분을 명시해 GitHub cron 파서 호환성을 확보한다.
    - cron: '7,22,37,52 0-7 * * 1-5'
    # KST 평일 16:17: Yahoo 완료 일봉 확인 후 모드 2 패널 생성
    - cron: '17 7 * * 1-5'
  workflow_dispatch:
    inputs:
      task:
        description: '실행할 수집 작업'
        type: choice
        required: true
        default: collector
        options:
          - collector
          - mode2

concurrency:
  group: lrm60-15m-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    if: github.event.schedule == '7,22,37,52 0-7 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.task == 'collector')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: quant-collector/requirements.txt

      - name: 수집기 의존성 설치
        working-directory: quant-collector
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 완료봉 수집 및 LRM-60 가상 기록
        working-directory: quant-collector
        run: |
          for attempt in 1 2 3; do
            if python collector.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "3회 재시도 후 수집 실패"
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: 데이터·운영 대시보드 기록
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quant-collector/data/ quant-collector/README.md README.md
          if git diff --staged --quiet; then
            echo "기록할 변경사항 없음"
            exit 0
          fi
          git commit -m "chore(collector): refresh LRM-60 15m [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then
              echo "5회 재시도 후 push 실패"
              exit 1
            fi
            sleep $((attempt * 5))
          done
  mode2-daily:
    if: github.event.schedule == '17 7 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.task == 'mode2')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: quant-collector/requirements.txt

      - name: 일봉 계산 의존성 설치
        run: python -m pip install -r quant-collector/requirements.txt

      - name: 모드 2 완료 일봉·팩터 관찰
        run: python quant-collector/mode2_daily.py

      - name: 원본 수신 스냅샷 보관 (30일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode2-daily-${{ github.run_id }}
          path: quant-collector/data/mode2_snapshots/
          retention-days: 30
          if-no-files-found: warn

      - name: 모바일 패널·실행 상태 기록
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md quant-collector/data/mode2_latest_manifest.json
          if [ -f quant-collector/data/mode2_plan_state.json ]; then
            git add quant-collector/data/mode2_plan_state.json
          fi
          if git diff --staged --quiet; then
            echo "기록할 변경사항 없음"
            exit 0
          fi
          git commit -m "chore(mode2): refresh daily factor panel [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then
              echo "5회 재시도 후 push 실패"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          # 예약 재시도 실패 시 작업을 실패로 종료한다.
