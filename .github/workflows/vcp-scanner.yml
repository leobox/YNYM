name: VCP Super New-High Scanner

on:
  schedule:
    # 한국 장중 (월~금 KST 09:30, 11:30, 13:30, 15:30 / UTC 00:30, 02:30, 04:30, 06:30) 2시간 주기 자동 스캔
    - cron: '30 0,2,4,6 * * 1-5'
  workflow_dispatch: # 스마트폰 GitHub 웹/앱에서 버튼 하나로 즉시 수동 실행

permissions:
  contents: write

jobs:
  check-holiday:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 한국 공휴일 여부 확인
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pip install -q holidays
          IS_HOLIDAY=$(python - <<'EOF'
          import datetime
          import holidays

          kr_holidays = holidays.KR()
          today = (datetime.datetime.utcnow() + datetime.timedelta(hours=9)).date()
          print("true" if today in kr_holidays else "false")
          EOF
          )
          if [ "$IS_HOLIDAY" = "true" ]; then
            echo "오늘은 한국 공휴일 -> 스킵"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  run-vcp-scanner:
    needs: check-holiday
    if: needs.check-holiday.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: quant-research/requirements.txt

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          if [ -f quant-research/requirements.txt ]; then pip install -r quant-research/requirements.txt; fi
          pip install -q finance-datareader requests pandas numpy

      - name: VCP 슈퍼 신고가 스캐너 실행 (최대 3회 재시도)
        run: |
          for attempt in 1 2 3; do
            if python quant-research/scripts/run_vcp_scanner.py; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "3회 재시도 후에도 VCP 스캔 실패"
              exit 1
            fi
            echo "VCP 스캔 재시도 대기 ($attempt/3)..."
            sleep $((attempt * 20))
          done

      - name: 스캔 결과 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quant-research/data/vcp_snapshots/
          if git diff --staged --quiet; then
            echo "새로 변경된 VCP 스캔 데이터가 없습니다."
          else
            git commit -m "chore(vcp): automated vcp scan snapshot [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "5회 재시도 후에도 push 실패"
                exit 1
              fi
              echo "push 충돌 재시도 대기 ($attempt/5)..."
              sleep $((attempt * 5))
            done
          fi
