name: Quant 15m Collector · LRM-60

on:
  schedule:
    # KST 평일 09:07~15:52 15분 간격, 16:07에 최종 확인 (UTC, 정각 혼잡 회피)
    - cron: '7,22,37,52 0-6 * * 1-5'
    - cron: '7 7 * * 1-5'
  workflow_dispatch: # 스마트폰 웹 브라우저 또는 GitHub 웹에서 버튼 클릭으로 즉시 수동 실행

concurrency:
  group: quant-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: quant-collector/requirements.txt

      - name: 의존성 패키지 설치
        working-directory: quant-collector
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 시세 수집·LRM-60 가상 추적·전진 라벨러 실행 (최대 3회 재시도)
        working-directory: quant-collector
        run: |
          for attempt in 1 2 3; do
            if python collector.py; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "3회 재시도 후에도 수집 실패"
              exit 1
            fi
            echo "수집 실패, ${attempt}회차 재시도 대기 중..."
            sleep $((attempt * 15))
          done

      - name: 수집된 시세 데이터 및 대시보드 자동 커밋 및 푸시
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add quant-collector/data/ quant-collector/README.md README.md
          if git diff --staged --quiet; then
            echo "새로 기록된 시세 데이터 변경사항이 없습니다."
          else
            git commit -m "chore(collector): 15m automated refresh [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" -eq 5 ]; then
                echo "5회 재시도 후에도 push 실패"
                exit 1
              fi
              echo "push 충돌 감지, ${attempt}회차 재시도 대기 중..."
              sleep $((attempt * 5))
            done
          fi
