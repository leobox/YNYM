name: Quant Data Collector

on:
  schedule:
    # 한국 장중(KST 09:37 ~ 16:37, UTC 00:37 ~ 07:37, 월~금) 30분마다 자동 실행 (정각/30분 혼잡 회피: 7분, 37분)
    - cron: '37 0 * * 1-5'
    - cron: '7,37 1-7 * * 1-5'
  workflow_dispatch: # 스마트폰 웹 브라우저 또는 GitHub 웹에서 버튼 클릭으로 즉시 수동 실행

permissions:
  contents: write

jobs:
  run-collector:
    runs-on: ubuntu-latest

    steps:
      - name: 정시 30초 대기 (7분 30초 / 37분 30초 타이밍 동기화)
        if: github.event_name == 'schedule'
        run: sleep 30

      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: quant-collector/requirements.txt

      - name: 의존성 패키지 설치
        working-directory: quant-collector
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 시세 수집 스크립트 실행
        working-directory: quant-collector
        run: |
          python collector.py

      - name: 수집된 시세 데이터 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quant-collector/data/ quant-collector/README.md README.md
          if git diff --staged --quiet; then
            echo "새로 기록된 시세 데이터 변경사항이 없습니다."
          else
            git commit -m "chore(collector): automated market data record [skip ci]"
            git push
          fi
