name: Quant Data Collector

on:
  schedule:
    # 한국 장중 및 전후(KST 08:00 ~ 17:00, UTC 23:00 ~ 08:00) 매시간 정각 자동 실행
    - cron: '0 23,0-8 * * 1-5'
  workflow_dispatch: # 스마트폰 웹 브라우저 또는 GitHub 웹에서 버튼 클릭으로 즉시 수동 실행

permissions:
  contents: write

jobs:
  run-collector:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: quant-collector/requirements.txt

      - name: 의존성 패키지 설치
        working-directory: quant-collector
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 시세 수집 스크립트 실행
        working-directory: quant-collector
        run: |
          python collector.py

      - name: 수집된 시세 데이터 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quant-collector/data/
          if git diff --staged --quiet; then
            echo "새로 기록된 시세 데이터 변경사항이 없습니다."
          else
            git commit -m "chore(collector): automated hourly market data record [skip ci]"
            git push
          fi
