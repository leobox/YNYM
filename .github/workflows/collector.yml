name: Quant Data Collector

on:
  schedule:
    # 한국 장중(KST 09:37 ~ 16:37, UTC 00:37 ~ 07:37, 월~금) 30분마다 자동 실행 (정각/30분 혼잡 회피: 7분, 37분)
    - cron: '37 0 * * 1-5'
    - cron: '7,37 1-7 * * 1-5'
    # 장마감 안전망(16:50 KST): 오늘 16:00 이후 성공한 스캔이 하나도 없으면(장중 스케줄이
    # 전부 안 돌았을 경우) 여기서 60분봉 하루치를 한 번에 수집해 최소 1건의 스캔은 보장한다.
    # Yahoo Finance 봉 데이터는 항상 range=60d로 받아오므로 장중 실행 여부와 무관하게
    # 이 시점에 돌려도 그날 완료봉 전체를 그대로 확보할 수 있다.
    - cron: '50 7 * * 1-5'
  workflow_dispatch: # 스마트폰 웹 브라우저 또는 GitHub 웹에서 버튼 클릭으로 즉시 수동 실행

permissions:
  contents: write

jobs:
  check-holiday:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: 저장소 체크아웃 (장마감 안전망 중복 실행 여부 확인용)
        uses: actions/checkout@v4

      - name: 실행 여부 판단 (공휴일 스킵 + 장마감 안전망 중복 실행 방지)
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pip install -q holidays
          IS_HOLIDAY=$(python - <<'EOF'
          import datetime
          import holidays

          kr_holidays = holidays.KR()
          today = (datetime.datetime.utcnow() + datetime.timedelta(hours=9)).date()
          print("true" if today in kr_holidays else "false")
          EOF
          )
          if [ "$IS_HOLIDAY" = "true" ]; then
            echo "오늘은 한국 공휴일 -> should_run=false"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 16:50 KST 장마감 안전망 슬롯: 오늘 16:00 이후 이미 성공한 스캔이 있으면 중복 실행 생략
          if [ "${{ github.event.schedule }}" = "50 7 * * 1-5" ]; then
            TODAY=$(TZ=Asia/Seoul date +%Y%m%d)
            LATEST=$(ls "quant-collector/data/$TODAY"/*_scores.csv 2>/dev/null | sed -E 's#.*/([0-9]{4})_scores\.csv#\1#' | sort | tail -1)
            if [ -n "$LATEST" ] && [ "$LATEST" -ge "1600" ]; then
              echo "오늘 16:00 이후 이미 스캔 성공(${LATEST}) -> 장마감 안전망 생략"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "오늘 16:00 이후 성공한 스캔 없음(마지막: ${LATEST:-없음}) -> 장마감 안전망 실행"
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

  run-collector:
    needs: check-holiday
    if: needs.check-holiday.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 정시 30초 대기 (7분 30초 / 37분 30초 타이밍 동기화)
        if: github.event_name == 'schedule'
        run: sleep 30

      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: quant-collector/requirements.txt

      - name: 의존성 패키지 설치
        working-directory: quant-collector
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 시세 수집 스크립트 실행 (최대 3회 재시도)
        working-directory: quant-collector
        run: |
          for attempt in 1 2 3; do
            if python collector.py; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "3회 재시도 후에도 수집 실패"
              exit 1
            fi
            echo "수집 실패, ${attempt}회차 재시도 대기 중..."
            sleep $((attempt * 30))
          done

      - name: 수집된 시세 데이터 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quant-collector/data/ quant-collector/README.md README.md
          if git diff --staged --quiet; then
            echo "새로 기록된 시세 데이터 변경사항이 없습니다."
          else
            git commit -m "chore(collector): automated market data record [skip ci]"
            # 사용자가 같은 시간대에 수동으로 push하면 origin/main이 앞서갈 수 있으므로
            # rebase 후 재시도한다 (기존에는 단순 push라 충돌 시 이번 회차가 조용히 실패했음).
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "5회 재시도 후에도 push 실패"
                exit 1
              fi
              echo "push 충돌 감지, ${attempt}회차 재시도 대기 중..."
              sleep $((attempt * 5))
            done
          fi
