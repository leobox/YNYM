name: Quant 5m Auto Refresh Collector

on:
  schedule:
    # 5분마다 상시 자동 실행 및 대시보드 리프레시
    - cron: '*/5 * * * *'
  workflow_dispatch: # 스마트폰 웹 브라우저 또는 GitHub 웹에서 버튼 클릭으로 즉시 수동 실행

permissions:
  contents: write

jobs:
  run-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: quant-collector/requirements.txt

      - name: 의존성 패키지 설치
        working-directory: quant-collector
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 시세 수집 및 5분 전진 라벨러 실행 (최대 3회 재시도)
        working-directory: quant-collector
        run: |
          for attempt in 1 2 3; do
            if python collector.py; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "3회 재시도 후에도 수집 실패"
              exit 1
            fi
            echo "수집 실패, ${attempt}회차 재시도 대기 중..."
            sleep $((attempt * 15))
          done

      - name: 수집된 시세 데이터 및 대시보드 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quant-collector/data/ quant-collector/README.md README.md
          if git diff --staged --quiet; then
            echo "새로 기록된 시세 데이터 변경사항이 없습니다."
          else
            git commit -m "chore(collector): 5m automated refresh [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "5회 재시도 후에도 push 실패"
                exit 1
              fi
              echo "push 충돌 감지, ${attempt}회차 재시도 대기 중..."
              sleep $((attempt * 5))
            done
          fi
