name: ETF daily reference observation

on:
  schedule:
    # Weekdays 16:35 / 18:35 / 20:35 KST (completed daily bars; subsequent runs skip once sealed)
    - cron: '35 7 * * 1-5'
    - cron: '35 9 * * 1-5'
    - cron: '35 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-daily-reference
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Skip when today's ETF observation is already sealed cleanly
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target=$(TZ=Asia/Seoul date -d '16 hours ago' +%F)
          echo "target=$target"
          if [ -f "quant-research/data/etf_observation/latest.json" ]; then
            ok=$(python3 -c 'import json; d=json.load(open("quant-research/data/etf_observation/latest.json")); print("yes" if d.get("status")=="OK" and d.get("as_of")=="'"$target"'" else "no")' 2>/dev/null || echo "no")
            if [ "$ok" = "yes" ]; then
              echo "ETF observation for $target already OK; skipping redundant run."
              echo "done=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "done=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.done != 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: quant-research/requirements.txt
      - name: Install observer dependencies
        if: steps.gate.outputs.done != 'true'
        run: python -m pip install pandas numpy requests pytest
      - name: Validate ETF observer
        if: steps.gate.outputs.done != 'true'
        run: python -m pytest quant-research/tests/test_etf_observer.py -q
      - name: Fetch and publish local ETF panel
        if: steps.gate.outputs.done != 'true'
        id: observe
        shell: bash
        run: |
          for attempt in 1 2; do
            if python -B quant-research/scripts/run_etf_observation.py --readme README.md; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then sleep 30; fi
          done
          exit 1
      - name: Preserve raw provider responses
        if: always() && steps.gate.outputs.done != 'true' && steps.observe.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: etf-daily-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: quant-research/data/etf_observation/raw/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit observation or explicit failure state
        if: always() && steps.gate.outputs.done != 'true' && steps.observe.outcome != 'skipped'
        shell: bash
        run: |
          test -f quant-research/data/etf_observation/latest.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          cp README.md "${RUNNER_TEMP}/etf_root_readme.md"
          git add README.md quant-research/data/etf_observation/latest.json quant-research/data/etf_observation/latest.md quant-research/data/etf_observation/runs/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: update ETF reference observation [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git checkout origin/main -- README.md
            python -c '
          import pathlib
          tmp_readme = pathlib.Path("'"${RUNNER_TEMP}"'/etf_root_readme.md").read_text(encoding="utf-8")
          s, e = "<!-- ETF_OBSERVATION:START -->", "<!-- ETF_OBSERVATION:END -->"
          if s in tmp_readme and e in tmp_readme:
              block = tmp_readme[tmp_readme.index(s):tmp_readme.index(e)+len(e)]
              cur = pathlib.Path("README.md").read_text(encoding="utf-8")
              if s in cur and e in cur:
                  new_cur = cur[:cur.index(s)] + block + cur[cur.index(e)+len(e):]
                  pathlib.Path("README.md").write_text(new_cur, encoding="utf-8")
          '
            git add README.md
            git commit --amend --no-edit
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
