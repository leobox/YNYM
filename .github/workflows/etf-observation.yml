name: ETF daily reference observation

on:
  schedule:
    - cron: '35 11 * * 1-5' # Weekdays 20:35 KST, completed daily bars
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-daily-reference
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: quant-research/requirements.txt
      - name: Install observer dependencies
        run: python -m pip install pandas numpy requests pytest
      - name: Validate ETF observer
        run: python -m pytest quant-research/tests/test_etf_observer.py -q
      - name: Fetch and publish local ETF panel
        id: observe
        run: python -B quant-research/scripts/run_etf_observation.py --readme README.md
      - name: Preserve raw provider responses
        if: always() && steps.observe.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: etf-daily-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: quant-research/data/etf_observation/raw/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit observation or explicit failure state
        if: always() && steps.observe.outcome != 'skipped'
        shell: bash
        run: |
          test -f quant-research/data/etf_observation/latest.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md quant-research/data/etf_observation/latest.json quant-research/data/etf_observation/latest.md quant-research/data/etf_observation/runs/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: update ETF reference observation [skip ci]'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
