name: Daily Breakout & ETF README Update

on:
  schedule:
    # 평일 KRX 정규장 마감 이후 1차 실행 (16:35 KST) 및 2차 백업 실행 (20:00 KST)
    - cron: '35 7 * * 1-5'
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

concurrency:
  group: daily-readme-breakout-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Update Stock 20d Breakout & Market Regime Panel
        env:
          TZ: Asia/Seoul
        run: |
          set -euo pipefail
          rm -rf quant-research/data/daily_3y
          python quant-research/scripts/fetch_daily_history.py \
            --range 3y \
            --refresh-universe \
            --carryover-runs quant-research/data/research/T-110/runs

          MANIFEST=$(ls -1t quant-research/data/research/T-063/fetch_manifest_3y_*.json | head -n 1)
          OUT=$(python quant-research/scripts/run_early_inception_forward.py \
            --data quant-research/data/daily_3y \
            --manifest "$MANIFEST" \
            --runs quant-research/data/research/T-110/runs \
            --readme README.md)
          echo "$OUT"

          STATUS=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["status"])' "$OUT")
          REASON=$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("reason",""))' "$OUT")
          python quant-research/scripts/refresh_forward_status.py \
            --readme README.md \
            --latest quant-research/data/research/T-110/latest.md \
            --status "$STATUS" \
            --reason "$REASON"

          # 최근 10거래일 초과 이력 JSON은 정리하여 불필요한 백데이터 누적을 방지
          python -c '
          from pathlib import Path
          runs = sorted(Path("quant-research/data/research/T-110/runs").glob("????-??-??.json"))
          for old in runs[:-10]:
              old.unlink(missing_ok=True)
          '

      - name: Update ETF 20d Breakout Panel
        env:
          TZ: Asia/Seoul
        run: |
          python quant-research/scripts/run_etf_observation.py \
            --out-dir /tmp/etf_observation \
            --readme README.md

      - name: Commit and push README update
        run: |
          # 불필요한 백데이터(manifest, 임시 스냅샷 등)는 워킹트리에서 되돌리고 README와 최근 10일 추이만 커밋
          git checkout -- quant-research/data/vcp_snapshots quant-research/data/research/T-063 2>/dev/null || true
          git clean -fd quant-research/data/vcp_snapshots quant-research/data/research/T-063 quant-research/data/daily_3y 2>/dev/null || true

          git add README.md quant-research/data/research/T-110/runs
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update daily 20d breakout & ETF README [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase -X ours origin "${GITHUB_REF_NAME:-main}" && git push origin "HEAD:${GITHUB_REF_NAME:-main}" && break
            sleep 3
          done
