name: Daily Breakout, ETF & Sector RS README Update

on:
  schedule:
    # 평일 KRX 정규장 마감 이후 1차 실행 (16:35 KST) 및 2차 백업 실행 (20:00 KST)
    - cron: '35 7 * * 1-5'
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

concurrency:
  group: daily-readme-breakout-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Update Stock 20d Breakout & Market Regime Panel
        env:
          TZ: Asia/Seoul
        run: |
          set -euo pipefail
          rm -rf quant-research/data/daily_3y
          python quant-research/scripts/fetch_daily_history.py \
            --range 3y \
            --refresh-universe \
            --carryover-runs quant-research/data/research/T-110/runs

          MANIFEST=$(ls -1t quant-research/data/research/T-063/fetch_manifest_3y_*.json | head -n 1)
          OUT=$(python quant-research/scripts/run_early_inception_forward.py \
            --data quant-research/data/daily_3y \
            --manifest "$MANIFEST" \
            --runs quant-research/data/research/T-110/runs \
            --readme README.md)
          echo "$OUT"

          STATUS=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["status"])' "$OUT")
          REASON=$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("reason",""))' "$OUT")
          python quant-research/scripts/refresh_forward_status.py \
            --readme README.md \
            --latest quant-research/data/research/T-110/latest.md \
            --status "$STATUS" \
            --reason "$REASON"

          # 봉인된 신호 JSON은 계속 보존한다. 20거래일 후 성과 확정 및
          # 이후 성과 재계산의 입력이므로 화면의 최근 추이와 별개로 유지한다.

      - name: Update ETF 20d Breakout Panel
        env:
          TZ: Asia/Seoul
        run: |
          python quant-research/scripts/run_etf_observation.py \
            --out-dir /tmp/etf_observation \
            --readme README.md

      - name: Update Sector RS v1.0 Observation Panel
        env:
          TZ: Asia/Seoul
        run: |
          python quant-research/scripts/run_sector_v1_observation.py \
            --output quant-research/data/research/T-150 \
            --raw-dir /tmp/sector_v1_raw \
            --readme README.md

      - name: Commit and push README update
        run: |
          set -euo pipefail
          # 임시 수집 자료를 정리하고 README와 누적 신호·평가 기록을 커밋한다.
          git checkout -- quant-research/data/vcp_snapshots quant-research/data/research/T-063 2>/dev/null || true
          git clean -fd quant-research/data/vcp_snapshots quant-research/data/research/T-063 quant-research/data/daily_3y 2>/dev/null || true

          git add README.md quant-research/data/research/T-110/runs quant-research/data/research/T-150/runs
          # 데이터 검증 보류 시에는 outcomes.json 등이 아직 없을 수 있다.
          for output in quant-research/data/research/T-110/outcomes.json quant-research/data/research/T-110/latest.md quant-research/data/research/T-150/latest.md; do
            if [ -f "$output" ]; then
              git add "$output"
            fi
          done
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update daily breakout, ETF & Sector RS README [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME:-main}" && git push origin "HEAD:${GITHUB_REF_NAME:-main}"; then
              echo "README 및 전진 기록 게시 완료"
              exit 0
            fi
            # 충돌한 rebase를 원복하여 다음 시도가 같은 로컬 커밋에서 시작하게 한다.
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 3 ]; then
              echo "::error::3회 재시도 후에도 README 및 전진 기록 게시 실패"
              exit 1
            fi
            sleep $((3 * attempt))
          done
