name: Early Inception daily forward observation

on:
  schedule:
    # Weekdays 20:07 / 21:07 / 22:07 / 23:07 KST. GitHub cron is frequently delayed by
    # hours or dropped, so several attempts are queued; the first success seals the day
    # and later runs exit at the gate step without fetching anything.
    - cron: '7 11 * * 1-5'
    - cron: '7 12 * * 1-5'
    - cron: '7 13 * * 1-5'
    - cron: '7 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dual-strategy-forward
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Skip when today's completed bar is already sealed
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: running without gate check."
            echo "done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Target session = KST date 16h ago (20:00 -> today, 01:00 after a late queue -> yesterday).
          target=$(TZ=Asia/Seoul date -d '16 hours ago' +%F)
          echo "target=$target"
          if [ -f "quant-research/data/research/T-110/runs/$target.json" ]; then
            echo "$target already sealed; nothing to do."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.done != 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: quant-research/requirements.txt
      - name: Install data and research dependencies
        if: steps.gate.outputs.done != 'true'
        run: python -m pip install -r quant-research/requirements.txt pytest
      - name: Validate forward observer and panel
        if: steps.gate.outputs.done != 'true'
        run: python -m pytest quant-research/tests/test_early_inception_forward.py quant-research/tests/test_early_inception_engine.py -q
      - name: Fetch and seal one completed-bar decision (with retries)
        if: steps.gate.outputs.done != 'true'
        id: observe
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            if python -B quant-research/scripts/fetch_daily_history.py --range 3y --refresh-universe --carryover-runs quant-research/data/research/T-110/runs; then
              manifest=$(find quant-research/data/research/T-063 -name 'fetch_manifest_3y_*.json' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
              if result=$(python -B quant-research/scripts/run_early_inception_forward.py --manifest "$manifest" --readme README.md); then
                echo "$result"
                status=$(printf '%s' "$result" | python -c 'import json,sys; print(json.load(sys.stdin).get("status", "CAPTURED"))')
                echo "status=$status" >> "$GITHUB_OUTPUT"
                echo "as_of=$(printf '%s' "$result" | python -c 'import json,sys; print(json.load(sys.stdin).get("as_of", ""))')" >> "$GITHUB_OUTPUT"
                echo "::endgroup::"
                exit 0
              fi
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 120)); fi
          done
          echo "3회 시도 모두 실패"
          exit 1
      - name: Preserve exact inputs for the observation
        if: steps.observe.outputs.status == 'CAPTURED' || steps.observe.outputs.status == 'BACKFILLED'
        shell: bash
        run: |
          asof="${{ steps.observe.outputs.as_of }}"
          name="$asof"
          if [ "${{ steps.observe.outputs.status }}" = "BACKFILLED" ]; then
            name="backfill_from_${asof}_$(TZ=Asia/Seoul date +%Y%m%d%H%M)"
          fi
          mkdir -p quant-research/data/research/T-110/raw
          tar -czf "quant-research/data/research/T-110/raw/$name.tar.gz" -C quant-research/data daily_3y
      - name: Commit research records and refreshed panel
        if: steps.observe.outputs.status == 'CAPTURED' || steps.observe.outputs.status == 'BACKFILLED' || steps.observe.outputs.status == 'REUSED'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.observe.outputs.status }}" != "REUSED" ]; then
            git add quant-research/data/research/T-063/fetch_manifest_3y_*.json
            git add quant-research/data/vcp_snapshots/universe_*.csv
            git add quant-research/data/research/T-110/
          else
            # Re-render from the immutable record without replacing its source archive.
            git add quant-research/data/research/T-110/latest.md
            git add quant-research/data/research/T-110/outcomes.json
          fi
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "data: seal dual-strategy forward observation [skip ci]"
            if [ "${{ steps.observe.outputs.status }}" = "REUSED" ]; then
              git stash push --include-untracked -m reused-fetch-inputs -- quant-research/data/research/T-063/ quant-research/data/vcp_snapshots/
            fi
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" -eq 5 ]; then
                echo "5회 재시도 후에도 관찰 기록 push 실패"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
