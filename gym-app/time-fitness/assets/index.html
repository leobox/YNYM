<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#303238"><title>타임 피트니스</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="management.css"></head>
<body>
<main id="app">
 <header><img class="logo" src="icon.jpg" alt="TIME FITNESS"><div class="brand">타임 피트니스<small>나의 운동 캘린더</small></div><button id="settings-open" aria-label="설정">⚙</button><div class="switch" aria-label="캘린더 보기"><button data-mode="week" aria-pressed="true">주</button><button data-mode="month" aria-pressed="false">월</button></div></header>
 <div class="period"><div><small id="year-month"></small><h1 id="period-title"></h1></div><div class="navigate"><button data-nav="-1" aria-label="이전 기간">‹</button><button id="today">오늘</button><button data-nav="1" aria-label="다음 기간">›</button></div></div>
 <div class="legend"><span class="solo">● 개인운동</span><span class="pt">● PT</span></div>
 <div id="calendar-scroll"><div id="calendar" class="week" aria-label="운동 캘린더"></div></div>
 <div id="storage-error" role="alert" hidden></div>
</main>
<div id="viewer" class="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="viewer-title"><div class="sheet-head"><div><h2 id="viewer-title"></h2><span id="viewer-kind"></span></div><button class="close" data-close="viewer" aria-label="운동 목록 닫기">×</button></div><div id="workout-list"></div><button id="memo-save" class="save">메모 저장</button><p class="save-state" id="memo-state" aria-live="polite"></p><button class="unlock" id="unlock">운동 추가 / 편집</button></section></div>
<div id="editor" class="overlay" hidden><form class="sheet" id="workout-form" role="dialog" aria-modal="true" aria-labelledby="editor-title" novalidate><div class="sheet-head"><h2 id="editor-title"></h2><button type="button" class="close" data-close="editor" aria-label="운동 편집 닫기">×</button></div>
 <label>운동 구분<select name="kind"><option value="solo">개인운동</option><option value="pt">PT</option></select></label>
 <div class="entry"><label>운동 분류<select name="category"><option>전체 보기</option><option>상체</option><option>하체</option><option>기타</option></select></label><label id="exercise-label">운동명<select name="exercise"><option value="">등록된 운동 없음</option></select></label><div id="library-actions"><button id="new-name" class="text-button" type="button">＋ 운동명 추가</button><button id="rename-name" class="text-button" type="button" disabled>수정</button><button id="delete-name" class="text-button" type="button" disabled>삭제</button></div><div id="name-panel" hidden><label id="name-group-label" hidden>운동 분류<select name="nameGroup"><option>상체</option><option>하체</option><option>기타</option></select></label><label><span id="target-group"></span> 운동명<input name="newName" maxlength="80" placeholder="추가할 운동명" autocomplete="off"></label><p id="name-error" class="error" role="alert"></p><div class="name-actions"><button id="name-cancel" type="button">취소</button><button id="name-save" type="button">저장</button></div></div>
 <div class="numbers"><label>무게 · kg<input name="kg" type="number" min="0" step="any" value="20" inputmode="decimal"></label><label>횟수<input name="reps" type="number" min="1" step="1" value="12" inputmode="numeric"></label><label>세트<input name="sets" type="number" min="1" step="1" value="3" inputmode="numeric"></label></div>
 <p class="error" id="entry-error" role="alert"></p><button type="button" id="add" class="add">＋ 운동 추가</button><button type="button" id="cancel-entry" class="text-button" hidden>수정 취소</button></div>
 <div class="list-heading">등록한 운동 <span id="draft-count">0</span></div><div id="draft-list"></div><button type="submit" class="save">저장</button>
</form></div>
<div id="settings" class="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title"><div class="sheet-head"><h2 id="settings-title">설정</h2><button class="close" id="settings-close" aria-label="설정 닫기">×</button></div><h3 class="section-title">데이터 보관</h3><p class="helper">운동 기록, 메모, 분류별 운동 목록을<br>파일 하나에 보관합니다.</p><button id="export-backup" class="backup-action"><b>전체 백업</b><small>백업 파일 저장</small></button><button id="import-backup" class="backup-action"><b>가져오기</b><small>저장한 백업 파일 선택</small></button><input type="file" id="import-file" accept=".json,application/json" hidden><p id="backup-status" role="status"></p><div id="import-review" hidden><h3>가져올 데이터</h3><p id="import-summary"></p><small>현재 저장된 전체 데이터를 교체합니다.</small><div class="name-actions"><button id="import-cancel">취소</button><button id="import-apply">가져오기</button></div></div><p class="helper">휴대폰을 바꿀 때 백업 파일을 옮겨 가져오세요.</p></section></div>
<div id="toast" hidden role="status"></div>
<div id="splash"><img class="launch-photo" src="launch.jpg" alt="타임 피트니스 헬스장"><div class="launch-content"><img src="icon.jpg" alt="TIME FITNESS"><h2>타임 피트니스</h2><p>오늘의 운동, 나의 시간.</p></div></div>
<script src="data.js"></script><script src="app.js"></script></body></html>
